# Render Blueprint - Infrastructure as Code
# Deploy: https://dashboard.render.com/blueprints
# Database: Supabase PostgreSQL (hrcepttoscyhbntaqema)

services:
  # Flask Backend API
  - type: web
    name: barbarossa-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: .
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend && \
      echo "=== Initializing PostgreSQL schema (idempotent) ===" && \
      python init_postgres.py && \
      echo "=== Starting Gunicorn server ===" && \
      gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: FLASK_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false # Set manually in dashboard
      - key: FRONTEND_URL
        value: https://barbarossa-prep.vercel.app
      - key: SUPABASE_DB_URL
        sync: false # Set manually in dashboard - Supabase PostgreSQL connection string
      - key: SUPABASE_URL
        value: https://hrcepttoscyhbntaqema.supabase.co
      - key: SUPABASE_KEY
        sync: false # Set manually in dashboard - Supabase anon/service key
    autoDeploy: true
    healthCheckPath: /api/health

# Database now hosted on Supabase (free tier, no 90-day expiry)
# No Render database section needed
