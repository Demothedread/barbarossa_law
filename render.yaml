# Render Blueprint - Infrastructure as Code
# Deploy: https://dashboard.render.com/blueprints

services:
  # Flask Backend API
  - type: web
    name: barbarossa-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: .
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend && \
      echo "=== Initializing PostgreSQL schema ===" && \
      python init_postgres.py && \
      echo "=== Migrating SQLite data to PostgreSQL ===" && \
      python migrate_sqlite_to_postgres.py && \
      echo "=== Starting Gunicorn server ===" && \
      gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: FLASK_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false # Set manually in dashboard
      - key: FRONTEND_URL
        value: https://barbarossa-prep.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: barbarossa-db
          property: connectionString
    autoDeploy: true
    healthCheckPath: /api/health

databases:
  # PostgreSQL Database (Free tier - 256MB, 90-day limit)
  - name: barbarossa-db
    databaseName: barbarossa_law
    region: oregon
    plan: free
    ipAllowList: [] # Allow all IPs (required for free tier)
